services:
  db:
    image: postgres:16
    container_name: bookingapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appadmin
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Files here run once, in filename order, the first time the volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appadmin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
