name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: true

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # No real S3 backend exists yet for this assessment, so we validate
      # and plan locally instead of against remote state.
      - name: Terraform init (no backend)
        id: init
        run: terraform init -backend=false

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -refresh=false -input=false -no-color -var-file=terraform.tfvars
        continue-on-error: true

      - name: Save plan output to file
        run: |
          cat <<'EOF' > plan-${{ matrix.environment }}.txt
          ${{ steps.plan.outputs.stdout }}
          EOF

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: infra/envs/${{ matrix.environment }}/plan-${{ matrix.environment }}.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
          ENVIRONMENT: ${{ matrix.environment }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const maxLen = 60000; // stay under GitHub's comment size limit
            let plan = process.env.PLAN || "";
            if (plan.length > maxLen) {
              plan = plan.slice(0, maxLen) + "\n... (truncated, see workflow artifact for full plan)";
            }

            const body = [
              `#### Terraform Plan – \`${process.env.ENVIRONMENT}\``,
              `fmt: \`${process.env.FMT_OUTCOME}\` · validate: \`${process.env.VALIDATE_OUTCOME}\` · plan: \`${process.env.PLAN_OUTCOME}\``,
              "```",
              plan,
              "```",
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if a step failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
